name: Create Milestones

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  create-milestones:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create milestones
        uses: actions/github-script@v7
        with:
          script: |
            const milestones = [
              'Phase1: Requirements Specification',
              'Phase 2: Software Design Spec',
              'Phase 3: Design & Test Spec',
              'Phase 4: Final System',
            ];

            const existing = await github.paginate(github.rest.issues.listMilestones, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
            });
            const existingTitles = existing.map(m => m.title);

            for (const title of milestones) {
              if (existingTitles.includes(title)) {
                console.log(`Milestone already exists: ${title}`);
              } else {
                await github.rest.issues.createMilestone({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                });
                console.log(`Created milestone: ${title}`);
              }
            }
