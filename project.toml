# ---- Acceptance criteria. ----
[[ac]]
id = "AC1"
text = "From a clean state, documented commands create the cluster; `kubectl get nodes` shows 5 `Ready` nodes on `v1.36.6+k3s1`; done by someone who did not write the guide."
[[ac]]
id = "AC2"
text = "CI builds the client image; it runs as non-root; `python -c \"import torch; print(torch.__version__)\"` prints `2.15.0+cpu`; the image contains no dataset or secret."
[[ac]]
id = "AC3"
text = "Four Jobs (one per hospital node) reach `Complete`; `kubectl get pods -o wide -n fl-system` shows four different nodes; each logs `selfcheck: ok`."
[[ac]]
id = "AC4"
text = "A deliberately failing PR (lint, test, Dockerfile lint, secret) is blocked from merging."
[[ac]]
id = "AC5"
text = "Two clean installs from the lockfile give identical `pip freeze`."
[[ac]]
id = "AC6"
text = "Unit coverage >= 80% on new code (adjust after first measurement); no fixable CRITICAL vulnerability in the image, or a reviewed ignore list."
[[ac]]
id = "AC7"
text = "ADR 0003 merged with a recommendation and advisor acknowledgement."
