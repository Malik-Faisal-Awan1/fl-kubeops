# SINGLE SOURCE OF TRUTH for project facts.
# Edit THIS file, then run `make docs`. Never hand-edit text between
# "<!-- BEGIN GENERATED:... -->" and "<!-- END GENERATED:... -->" markers.
# Read by tools/docs.py (Python 3.11+ standard library only).

[project]
name = "FL-KubeOps"
sprint = "Sprint 1 (Foundation)"
sprint_status = "IN PROGRESS"
sprint_dates = "2026-11-09 to 2026-11-20 (assumed)"
objective = "A new contributor can clone this repo, bring up a pinned K3s cluster (1 server + 4 hospital agent nodes), build and run the FL client container on it, and every PR is gated by automated lint, test, image-build and security checks. No federated-learning logic yet."
capacity = "4 people x 10 h/week = 80 h per sprint (assumed, not confirmed); about 62 h planned"
out_of_scope = [
  "FLCluster CRD and kopf handlers",
  "training loop and datasets",
  "gRPC/protobuf",
  "any SMPC code",
  "Kubeflow/MLflow install",
  "JWT/RBAC",
  "TLS 1.3",
  "Prometheus",
  "Sphinx",
  "any registry or hosted deployment",
]

# ---- Top-level folders. Any top-level folder not listed here fails the docs check. ----
[[path]]
path = "operator"
purpose = "kopf operator (`src/`, `tests/`, `config/default.yaml`)"
[[path]]
path = "clients"
purpose = "FL client and its Dockerfile"
[[path]]
path = "pipeline"
purpose = "Kubeflow Pipelines and MLflow code (empty until Sprint 8)"
[[path]]
path = "deploy"
purpose = "cluster scripts and Kubernetes manifests (`deploy/k3s/`)"
[[path]]
path = "docs"
purpose = "SRS, figures, sprint plan, ADRs"
[[path]]
path = "tools"
purpose = "repository tooling (`tools/docs.py` keeps these docs in sync)"

# ---- Repository state, computed from the filesystem on every run. ----
# kind = "code" counts toward "application code exists".
[[state]]
label = "Operator Python code"
glob = "operator/src/**/*.py"
kind = "code"
[[state]]
label = "Client Python code"
glob = "clients/src/**/*.py"
kind = "code"
[[state]]
label = "Pipeline Python code"
glob = "pipeline/**/*.py"
kind = "code"
[[state]]
label = "Unit tests (application)"
glob = "*/tests/**/test_*.py"
[[state]]
label = "Client Dockerfile"
glob = "clients/Dockerfile"
[[state]]
label = "Per-component pyproject.toml"
glob = "*/pyproject.toml"
[[state]]
label = "Hashed lockfiles"
glob = "*/requirements.lock"
[[state]]
label = "Ruff config"
glob = "ruff.toml"
[[state]]
label = "CI workflow (ci.yml)"
glob = ".github/workflows/ci.yml"
[[state]]
label = "Docs-sync workflow"
glob = ".github/workflows/docs-sync.yml"
[[state]]
label = "Cluster scripts"
glob = "deploy/k3s/**/*.sh"
[[state]]
label = "Kubernetes manifests"
glob = "deploy/k3s/**/*.yaml"
[[state]]
label = "ADRs"
glob = "docs/adr/*.md"
[[state]]
label = "Compatibility matrix"
glob = "docs/compatibility-matrix.md"
[[state]]
label = "Dev setup guide"
glob = "docs/dev-setup.md"

# ---- Commands. Listed in docs ONLY if the Makefile defines the target. ----
[[command]]
cmd = "make docs"
target = "docs"
purpose = "regenerate README/AGENTS/sprint docs from project.toml and the repo"
[[command]]
cmd = "make docs-check"
target = "docs-check"
purpose = "fail if docs are out of date or a repo rule is broken (same check CI runs)"
[[command]]
cmd = "make test-tools"
target = "test-tools"
purpose = "run the unit tests of tools/docs.py"
[[command]]
cmd = "make hooks"
target = "hooks"
purpose = "enable the pre-commit hook that runs `make docs` automatically (run once per clone)"
[[command]]
cmd = "make lint"
target = "lint"
purpose = "ruff check and format check"
[[command]]
cmd = "make test"
target = "test"
purpose = "run unit tests with coverage"
[[command]]
cmd = "make cluster-up"
target = "cluster-up"
purpose = "create the k3d cluster (1 server + 4 agents)"
[[command]]
cmd = "make cluster-down"
target = "cluster-down"
purpose = "delete the k3d cluster"
[[command]]
cmd = "make image"
target = "image"
purpose = "build the client image locally"

# ---- Binding decisions. `pins` are enforced against pyproject/requirements files. ----
[[decision]]
topic = "Python"
value = "3.12"
short = "Python 3.12"
[[decision]]
topic = "Kubernetes"
value = "K3s `v1.36.6+k3s1`: one server + four agent nodes"
short = "K3s v1.36.6+k3s1"
[[decision]]
topic = "Dev cluster"
value = "k3d `v5.9.0` running image `rancher/k3s:v1.36.6-k3s1` (image tag NOT yet verified on Docker Hub: check before use)"
short = "k3d v5.9.0"
[[decision]]
topic = "Hospital node"
value = "one K3s agent node (label `fl-kubeops.io/hospital=h1..h4`), not a pod"
[[decision]]
topic = "Namespace"
value = "`fl-system`"
[[decision]]
topic = "CRD"
value = "kind `FLCluster`, group `fl.kubeops.io`, CRD name `flclusters.fl.kubeops.io`"
[[decision]]
topic = "PyTorch"
value = "`torch==2.15.0`, CPU build only (CPU wheel index NOT yet verified reachable)"
short = "torch 2.15.0 (CPU)"
pins = ["torch==2.15.0"]
[[decision]]
topic = "Operator framework"
value = "`kopf==1.45.2`"
short = "kopf 1.45.2"
pins = ["kopf==1.45.2"]
[[decision]]
topic = "Lint + format"
value = "`ruff==0.17.4` (exact pin). Do not install flake8 or black"
short = "ruff 0.17.4"
pins = ["ruff==0.17.4"]
[[decision]]
topic = "Tests"
value = "`pytest==9.2.0`, `pytest-cov==7.1.0`"
short = "pytest 9.2.0"
pins = ["pytest==9.2.0", "pytest-cov==7.1.0"]
[[decision]]
topic = "Dependency locking"
value = "`uv==0.13.7` with hashes (`uv pip compile --generate-hashes`), one lockfile per component"
short = "uv 0.13.7"
pins = ["uv==0.13.7"]
[[decision]]
topic = "Builds"
value = "local only. No image registry, no publishing, no GHCR"
[[decision]]
topic = "Board"
value = "Notion (not GitHub Projects)"

